<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ada - Mentora TECNOLOchicas</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --purple-main: #552e89;
            --pink-accent: #e21b79;
            --purple-dark: #351a5c;
            --purple-light: #f4effa;
            --white: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--purple-light);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        .chat-container {
            width: 100%;
            max-width: 750px;
            height: 90vh;
            background: var(--white);
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(85, 46, 137, 0.2);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 2px solid rgba(85, 46, 137, 0.1);
        }

        .chat-header {
            background: linear-gradient(135deg, var(--purple-main), var(--pink-accent));
            color: var(--white);
            padding: 20px 25px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .avatar {
            width: 50px;
            height: 50px;
            background: var(--white);
            color: var(--pink-accent);
            font-weight: 700;
            font-size: 1.4rem;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            animation: pulseAvatar 2s infinite;
        }

        @keyframes pulseAvatar {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .header-title h1 {
            font-size: 1.3rem;
            font-weight: 700;
        }

        .header-title p {
            font-size: 0.85rem;
            opacity: 0.9;
        }

        .badge {
            background: rgba(255, 255, 255, 0.2);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            backdrop-filter: blur(5px);
        }

        /* Sección de Módulos Rápidos */
        .quick-modules {
            background: #fcf9ff;
            padding: 15px 20px;
            border-bottom: 1px solid rgba(85, 46, 137, 0.1);
        }

        .quick-modules p {
            font-size: 0.75rem;
            color: var(--purple-main);
            font-weight: 600;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .module-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 10px;
        }

        .module-btn {
            background: var(--white);
            border: 1px solid #e8e2f0;
            color: var(--purple-dark);
            padding: 10px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .module-btn:hover {
            background: var(--purple-main);
            color: var(--white);
            border-color: var(--purple-main);
            transform: translateY(-3px);
            box-shadow: 0 5px 12px rgba(85, 46, 137, 0.2);
        }

        /* Área de Mensajes */
        .chat-messages {
            flex: 1;
            padding: 25px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            background-color: #faf8fc;
        }

        .message {
            max-width: 85%;
            padding: 15px 20px;
            border-radius: 20px;
            font-size: 0.95rem;
            line-height: 1.5;
            word-wrap: break-word;
            animation: slideUp 0.4s cubic-bezier(0.1, 1, 0.1, 1);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(15px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .user-message {
            align-self: flex-end;
            background: linear-gradient(135deg, var(--purple-main), #6b3fa6);
            color: var(--white);
            border-bottom-right-radius: 4px;
        }

        .ada-message {
            align-self: flex-start;
            background: var(--white);
            color: var(--purple-dark);
            border-bottom-left-radius: 4px;
            border: 1px solid rgba(85, 46, 137, 0.15);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.04);
        }

        .ada-name {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--pink-accent);
            margin-bottom: 4px;
            display: block;
        }

        /* Input y Envío */
        .chat-input-container {
            padding: 20px;
            background: var(--white);
            border-top: 1px solid rgba(85, 46, 137, 0.08);
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .chat-input {
            flex: 1;
            padding: 15px 22px;
            border: 2px solid #e8e2f0;
            border-radius: 30px;
            outline: none;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        .chat-input:focus {
            border-color: var(--pink-accent);
            box-shadow: 0 0 0 4px rgba(226, 27, 121, 0.15);
        }

        .send-btn {
            background: linear-gradient(135deg, var(--pink-accent), var(--purple-main));
            color: var(--white);
            border: none;
            padding: 15px 28px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(226, 27, 121, 0.3);
        }

        .send-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(226, 27, 121, 0.4);
        }

        .send-btn:active {
            transform: scale(0.98);
        }

        @media (max-width: 600px) {
            .chat-container { height: 100vh; border-radius: 0; }
            body { padding: 0; }
            .module-grid { grid-template-columns: 1fr 1fr; }
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="chat-header">
            <div class="header-info">
                <div class="avatar">A</div>
                <div class="header-title">
                    <h1>Ada</h1>
                    <p>Mentora TECNOLOchicas</p>
                </div>
            </div>
            <span class="badge">IA Pedagógica</span>
        </div>

        <!-- Módulos de Acceso Rápido -->
        <div class="quick-modules">
            <p>Sugerencias para tus clases:</p>
            <div class="module-grid">
                <button class="module-btn" onclick="enviarModulo('Creación de videojuegos con Scratch')">🎮 Videojuegos Scratch</button>
                <button class="module-btn" onclick="enviarModulo('Mi primer chatbot IA con Scratch')">🤖 Chatbot Scratch</button>
                <button class="module-btn" onclick="enviarModulo('Codea un bot con Python')">🐍 Codea con Python</button>
                <button class="module-btn" onclick="enviarModulo('Electrolab - Componentes electrónicos')">⚡ Electrolab</button>
            </div>
        </div>

        <div class="chat-messages" id="chatMessages">
            <div class="message ada-message">
                <span class="ada-name">Ada</span>
                ¡Hola, Instructora! 💜 Soy Ada, tu mentora pedagógica. Elige uno de los temas de arriba o escribe tu duda para planear juntas una clase increíble.
            </div>
        </div>

        <div class="chat-input-container">
            <input type="text" id="userInput" class="chat-input" placeholder="Escribe tu consulta pedagógica..." onkeypress="handleKeyPress(event)">
            <button onclick="enviarMensaje()" class="send-btn">Enviar</button>
        </div>
    </div>

    <script>
        let conversationId = null;

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                enviarMensaje();
            }
        }

        function enviarModulo(nombreModulo) {
            const input = document.getElementById('userInput');
            input.value = `Dame ideas de actividades, explicaciones y dinámicas para enseñar el módulo: ${nombreModulo}`;
            enviarMensaje();
        }

        async function enviarMensaje() {
            const input = document.getElementById('userInput');
            const message = input.value.trim();
            if (!message) return;

            const chatMessages = document.getElementById('chatMessages');

            const userDiv = document.createElement('div');
            userDiv.className = 'message user-message';
            userDiv.textContent = message;
            chatMessages.appendChild(userDiv);

            input.value = '';
            chatMessages.scrollTop = chatMessages.scrollHeight;

            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'message ada-message';
            loadingDiv.id = 'loadingMessage';
            loadingDiv.innerHTML = '<span class="ada-name">Ada</span><i>Pensando la mejor estrategia pedagógica...</i>';
            chatMessages.appendChild(loadingDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: message, conversation_id: conversationId })
                });

                const data = await response.json();
                document.getElementById('loadingMessage').remove();

                if (data.error) {
                    const errorDiv = document.createElement('div');
                    errorDiv.className = 'message ada-message';
                    errorDiv.style.borderColor = '#ff4d4d';
                    errorDiv.innerHTML = `<span class="ada-name">Error</span>${data.error}`;
                    chatMessages.appendChild(errorDiv);
                } else {
                    conversationId = data.conversation_id;
                    const adaDiv = document.createElement('div');
                    adaDiv.className = 'message ada-message';
                    adaDiv.innerHTML = `<span class="ada-name">Ada</span>${data.reply}`;
                    chatMessages.appendChild(adaDiv);
                }
            } catch (err) {
                document.getElementById('loadingMessage').remove();
                const errorDiv = document.createElement('div');
                errorDiv.className = 'message ada-message';
                errorDiv.innerHTML = '<span class="ada-name">Error</span>No se pudo conectar con el servidor.';
                chatMessages.appendChild(errorDiv);
            }

            chatMessages.scrollTop = chatMessages.scrollHeight;
        }
    </script>
</body>
</html>
